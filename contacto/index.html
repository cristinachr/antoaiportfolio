<!DOCTYPE html>
<html lang="es">

  <head>
    <meta charset="UTF-8" />
    <title>yapoanto / Diseñadora</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
       <!-- Move to up button -->
    <div class="scroll-button">
      <a href="#home"><i class="fas fa-arrow-up"></i></a>
    </div>

    <!-- navgaition menu -->
    <nav>
      <div class="navbar">
        <div class="logo"><a href="../">AA</a></div>
        <ul class="menu">
          <li><a href="../portfolio/">PORTFOLIO</a></li>
          <li><a href="../about/">ABOUT ME</a></li>  
          <li><a href="contacto/">CONTACT</a></li>  
          <div class="cancel-btn">
            <i class="fas fa-times"></i>
          </div>
        </ul>
        <div class="media-icons">
          <a href="https://www.instagram.com/yapoanto/"><i class="fab fa-instagram"></i></a>
        </div>
      </div>
      <div class="menu-btn">
        <i class="fas fa-bars"></i>
      </div>
    </nav>

<!-- Escena Desk / Ilustradora -->
    <main class="contact-desk">
      <div class="desk-canvas">
        
        <!-- Tarjeta Izquierda (Sobre / Nota de bienvenida) -->
        <aside class="desk-note note-left">
          <div class="envelope-badge">
            <i class="far fa-envelope-open"></i>
          </div>
          <h4>¡Escríbeme!</h4>
          <p>No dudes en contactarme para cotizaciones o dudas</p>
        </aside>

        <!-- Hoja Central Cuaderno (Formulario) -->
        <section class="notebook-sheet">
          <div class="notebook-holes">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>

          <form class="notebook-form" action="https://formspree.io/f/TU_ID_AQUI" method="POST">
            <div class="notebook-header">
              <span class="to-label">to:</span>
              <a href="mailto:hola@yapoanto.cl" class="to-email">hola@yapoanto.cl</a>
            </div>

            <div class="input-line">
              <label for="name">de / nombre:</label>
              <input type="text" id="name" name="name" placeholder="tu nombre o marca" required />
            </div>

            <div class="input-line">
              <label for="email">email:</label>
              <input type="email" id="email" name="email" placeholder="tu@correo.com" required />
            </div>

            <div class="input-line message-line">
              <label for="message">Mensaje:</label>
              <textarea id="message" name="message" rows="3" placeholder="cuéntame de tu proyecto..." required></textarea>
            </div>

            <button type="submit" class="btn-notebook-send">enviar</button>
          </form>
        </section>

        <!-- Tarjeta Derecha (Post-It / Estado Freelance) -->
        <aside class="desk-note note-right">
          <div class="pin-clip"><i class="fas fa-paperclip"></i></div>
          <h4>Disponible</h4>
          <p>Para proyectos etc etc</p>
        </aside>

      </div>
    </main>

        <footer>
      <div class="text">
        <span>© 2026 yapoanto. Todos los derechos reservados.</span>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
